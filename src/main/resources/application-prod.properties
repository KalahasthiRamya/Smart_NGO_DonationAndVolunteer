# ==================================================
# Smart NGO Platform - Cloud Production Profile
# Driven by Environment Variables with Fail-Safe Fallback
# ==================================================

# Datasource Connection: Configured for Cloud MySQL or Embedded Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_ngo_prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Connection Pooling (HikariCP Production Optimization)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.max-lifetime=1200000

# Production Hibernate Config
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Thymeleaf Template Caching Enabled for High Speed
spring.thymeleaf.cache=true

# Service Integrations via Environment Variables
payment.mode=${PAYMENT_MODE:mock}
payment.razorpay.key=${PAYMENT_KEY:}
payment.razorpay.secret=${PAYMENT_SECRET:}

notification.mode=${NOTIFICATION_MODE:mock}
notification.email.api-key=${EMAIL_API_KEY:}
notification.sms.api-key=${SMS_API_KEY:}

# Production Security & Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Actuator Health Probe Endpoint Exposure
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
