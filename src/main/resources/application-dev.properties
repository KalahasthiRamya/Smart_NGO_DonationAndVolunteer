# ==================================================
# Smart NGO Platform - Development Environment Profile
# ==================================================

# Local H2 in-memory fallback / local MySQL configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartngo_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Development Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Dev Mode Integrations
spring.thymeleaf.cache=false
payment.mode=mock
notification.mode=mock

# Actuator
management.endpoints.web.exposure.include=health,info
