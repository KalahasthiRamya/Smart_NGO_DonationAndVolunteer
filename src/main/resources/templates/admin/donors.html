<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Donor Management')"></head>
<body>
    <div id="sidebar" th:replace="fragments/sidebar :: sidebar('donors')"></div>

    <div id="main-content">
        <header th:replace="fragments/header :: header('Donor Management')"></header>

        <div class="container-fluid p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Stats Bar -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <span class="stat-label">Total Donors</span>
                        <div class="stat-value" th:text="${totalDonors}">245</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <span class="stat-label">Active Donors</span>
                        <div class="stat-value text-success" th:text="${activeDonorsCount}">198</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <span class="stat-label">Total Donations</span>
                        <div class="stat-value text-primary">₹<span th:text="${#numbers.formatDecimal(totalDonationAmount, 1, 'COMMA', 2, 'POINT')}">1,25,000</span></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <span class="stat-label">This Month</span>
                        <div class="stat-value text-warning">₹25,000</div>
                    </div>
                </div>
            </div>

            <!-- Donor Table Card -->
            <div class="card custom-table-card">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="fw-bold mb-0 text-dark">Donor List</h6>
                    <div class="d-flex gap-2">
                        <form th:action="@{/admin/donors}" method="get" class="d-flex gap-2">
                            <input type="text" name="search" th:value="${searchKeyword}" class="form-control form-control-sm" placeholder="Search donor...">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-search"></i></button>
                        </form>
                        <a th:href="@{/reports/donations/export}" class="btn btn-sm btn-outline-success"><i class="bi bi-download me-1"></i> Export</a>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Total Donations (₹)</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="donor : ${donors}">
                                <td class="fw-bold text-muted" th:text="'D00' + ${donor.id}">D001</td>
                                <td>
                                    <div class="fw-semibold text-dark" th:text="${donor.user.name}">Rahul Patil</div>
                                </td>
                                <td th:text="${donor.user.email}">rahul@gmail.com</td>
                                <td th:text="${donor.user.phone}">9876543210</td>
                                <td class="fw-bold text-dark" th:text="${#numbers.formatDecimal(donor.totalDonations, 1, 'COMMA', 2, 'POINT')}">15,000</td>
                                <td>
                                    <span class="badge badge-status"
                                          th:classappend="${donor.status == 'ACTIVE'} ? 'badge-active' : 'badge-inactive'"
                                          th:text="${donor.status}">Active</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/donors/status}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${donor.id}">
                                        <input type="hidden" name="status" th:value="${donor.status == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
                                        <button type="submit" class="btn btn-sm text-secondary" th:title="${donor.status == 'ACTIVE' ? 'Deactivate' : 'Activate'}">
                                            <i class="bi" th:classappend="${donor.status == 'ACTIVE'} ? 'bi-toggle-on text-success fs-5' : 'bi-toggle-off text-muted fs-5'"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(donors)}">
                                <td colspan="7" class="text-center py-4 text-muted">No donor records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</body>
</html>
