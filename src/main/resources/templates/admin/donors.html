<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Donor Management')"></head>
<body>
    <div id="sidebar" th:replace="fragments/sidebar :: sidebar('donors')"></div>

    <div id="main-content">
        <header th:replace="fragments/header :: header('Donor Management')"></header>

        <div class="container-fluid p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold text-dark mb-1">Donor Management</h5>
                    <p class="text-muted small mb-0">Overview of all active and inactive contributors</p>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-ngo-primary" data-bs-toggle="modal" data-bs-target="#createDonorModal">
                        <i class="bi bi-plus-lg me-1"></i> Add New Donor
                    </button>
                    <a th:href="@{/reports/donations/export}" class="btn btn-outline-secondary">
                        <i class="bi bi-download me-1"></i> Export
                    </a>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-6 col-lg-3">
                    <div class="card metric-card">
                        <div class="metric-title">Total Donors</div>
                        <div class="metric-value" th:text="${totalDonors}">0</div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="card metric-card">
                        <div class="metric-title">Active Donors</div>
                        <div class="metric-value" th:text="${activeDonorsCount}">0</div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="card metric-card">
                        <div class="metric-title">Total Donations</div>
                        <div class="metric-value">₹<span th:text="${#numbers.formatDecimal(totalDonationAmount, 1, 'COMMA', 2, 'POINT')}">0.00</span></div>
                    </div>
                </div>
            </div>

            <!-- Filter / Search bar -->
            <div class="card border-0 shadow-sm p-3 mb-4">
                <form th:action="@{/admin/donors}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="search" th:value="${searchKeyword}" class="form-control border-start-0" placeholder="Search donor name or email...">
                        </div>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-secondary">Filter</button>
                        <a th:href="@{/admin/donors}" class="btn btn-link text-decoration-none">Reset</a>
                    </div>
                </form>
            </div>

            <!-- Donor Table -->
            <div class="card custom-table-card">
                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Total Donated</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="donor : ${donors}">
                                <td class="fw-bold" th:text="'D' + ${#numbers.formatInteger(donor.id, 4)}">D0001</td>
                                <td class="fw-semibold text-dark" th:text="${donor.user.name}">Rahul Patil</td>
                                <td th:text="${donor.user.email}">rahul@gmail.com</td>
                                <td th:text="${donor.user.phone}">9876543210</td>
                                <td class="fw-bold text-dark">₹<span th:text="${#numbers.formatDecimal(donor.totalDonations, 1, 'COMMA', 2, 'POINT')}">15,000.00</span></td>
                                <td>
                                    <span class="badge badge-status"
                                          th:classappend="${donor.status == 'ACTIVE'} ? 'badge-active' : 'badge-inactive'"
                                          th:text="${donor.status}">ACTIVE</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/donors/status}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${donor.id}">
                                        <input type="hidden" name="status" th:value="${donor.status == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary" 
                                                th:text="${donor.status == 'ACTIVE' ? 'Deactivate' : 'Activate'}">Toggle</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(donors)}">
                                <td colspan="7" class="text-center py-4 text-muted">No donors found matching criteria.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add New Donor Modal -->
        <div class="modal fade" id="createDonorModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold text-dark">Add New Donor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/donors/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Full Name</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Priya Sharma" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="e.g. priya@gmail.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="e.g. 9876543210">
                            </div>
                        </div>
                        <div class="modal-footer border-top-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-ngo-primary">Create Donor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</body>
</html>
