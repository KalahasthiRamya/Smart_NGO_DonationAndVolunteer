<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Volunteer Management')"></head>
<body>
    <div id="sidebar" th:replace="fragments/sidebar :: sidebar('volunteers')"></div>

    <div id="main-content">
        <header th:replace="fragments/header :: header('Volunteer Management')"></header>

        <div class="container-fluid p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold text-dark mb-1">Volunteer Coordination</h5>
                    <p class="text-muted small mb-0">Manage registered volunteers and skill allocations</p>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-ngo-primary" data-bs-toggle="modal" data-bs-target="#createVolunteerModal">
                        <i class="bi bi-person-plus me-1"></i> Add New Volunteer
                    </button>
                    <a th:href="@{/reports/volunteers/export}" class="btn btn-outline-secondary">
                        <i class="bi bi-download me-1"></i> Export
                    </a>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-6 col-lg-3">
                    <div class="card metric-card">
                        <div class="metric-title">Total Volunteers</div>
                        <div class="metric-value" th:text="${totalVolunteers}">0</div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="card metric-card">
                        <div class="metric-title">Active Volunteers</div>
                        <div class="metric-value" th:text="${activeVolunteers}">0</div>
                    </div>
                </div>
            </div>

            <!-- Filter / Search bar -->
            <div class="card border-0 shadow-sm p-3 mb-4">
                <form th:action="@{/admin/volunteers}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="search" th:value="${searchKeyword}" class="form-control border-start-0" placeholder="Search volunteer name or email...">
                        </div>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-secondary">Filter</button>
                        <a th:href="@{/admin/volunteers}" class="btn btn-link text-decoration-none">Reset</a>
                    </div>
                </form>
            </div>

            <!-- Volunteer Table -->
            <div class="card custom-table-card">
                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Skills</th>
                                <th>Status</th>
                                <th>Joined Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="vol : ${volunteers}">
                                <td class="fw-bold" th:text="'V' + ${#numbers.formatInteger(vol.id, 4)}">V0001</td>
                                <td class="fw-semibold text-dark" th:text="${vol.user.name}">Sneha Desai</td>
                                <td th:text="${vol.user.email}">sneha@gmail.com</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${vol.skills}">Teaching</span>
                                </td>
                                <td>
                                    <span class="badge badge-status"
                                          th:classappend="${vol.status == 'ACTIVE'} ? 'badge-active' : 'badge-inactive'"
                                          th:text="${vol.status}">ACTIVE</span>
                                </td>
                                <td th:text="${#temporals.format(vol.joinedDate, 'dd MMM yyyy')}">10 Jan 2024</td>
                                <td>
                                    <form th:action="@{/admin/volunteers/status}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${vol.id}">
                                        <input type="hidden" name="skills" th:value="${vol.skills}">
                                        <input type="hidden" name="status" th:value="${vol.status == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                                th:text="${vol.status == 'ACTIVE' ? 'Deactivate' : 'Activate'}">Toggle</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(volunteers)}">
                                <td colspan="7" class="text-center py-4 text-muted">No volunteers found matching criteria.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add New Volunteer Modal -->
        <div class="modal fade" id="createVolunteerModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold text-dark">Add New Volunteer</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/volunteers/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Full Name</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Rohan Kulkarni" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="e.g. rohan@gmail.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="e.g. 9876501234">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Password (Leave blank for default: volunteer123)</label>
                                <input type="password" name="password" class="form-control" placeholder="Default: volunteer123">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Skills & Expertise</label>
                                <select name="skills" class="form-select">
                                    <option value="Teaching">Teaching</option>
                                    <option value="Logistics">Logistics</option>
                                    <option value="Content Writing">Content Writing</option>
                                    <option value="Event Management">Event Management</option>
                                    <option value="Health / Counselling">Health / Counselling</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer border-top-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-ngo-primary">Create Volunteer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</body>
</html>
