<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Donation Management')"></head>
<body>
    <div id="sidebar" th:replace="fragments/sidebar :: sidebar('donations')"></div>

    <div id="main-content">
        <header th:replace="fragments/header :: header('Donation Management')"></header>

        <div class="container-fluid p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold text-dark mb-1">Donation Records</h5>
                    <p class="text-muted small mb-0">Track and log all incoming financial contributions</p>
                </div>
                <button type="button" class="btn btn-ngo-primary" data-bs-toggle="modal" data-bs-target="#createDonationModal">
                    <i class="bi bi-plus-lg me-1"></i> Record New Donation
                </button>
            </div>

            <!-- Table -->
            <div class="card custom-table-card">
                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>Txn ID</th>
                                <th>Donor</th>
                                <th>Campaign</th>
                                <th>Amount (₹)</th>
                                <th>Payment Method</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="don : ${donations}">
                                <td class="fw-bold text-primary" th:text="${don.transactionId}">TXN_10001</td>
                                <td th:text="${don.donor.user.name}">Rahul Patil</td>
                                <td th:text="${don.campaign.name}">Education for All</td>
                                <td class="fw-bold text-dark">₹<span th:text="${#numbers.formatDecimal(don.amount, 1, 'COMMA', 2, 'POINT')}">15,000</span></td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${don.paymentMethod}">UPI</span>
                                </td>
                                <td th:text="${#temporals.format(don.donationDate, 'dd MMM yyyy, HH:mm')}">01 May 2024</td>
                                <td>
                                    <span class="badge badge-status badge-active" th:text="${don.status}">SUCCESS</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(donations)}">
                                <td colspan="7" class="text-center py-4 text-muted">No donations recorded yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Record Donation Modal -->
        <div class="modal fade" id="createDonationModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold text-dark">Record New Donation</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/donations/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Select Donor</label>
                                <select name="donorId" class="form-select" required>
                                    <option th:each="d : ${donors}" th:value="${d.id}" th:text="${d.user.name} + ' (' + ${d.user.email} + ')'"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Select Campaign</label>
                                <select name="campaignId" class="form-select" required>
                                    <option th:each="c : ${campaigns}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Donation Amount (₹)</label>
                                <input type="number" step="0.01" name="amount" class="form-control" placeholder="e.g. 5000" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Payment Method</label>
                                <select name="paymentMethod" class="form-select" required>
                                    <option value="UPI">UPI</option>
                                    <option value="CARD">Credit/Debit Card</option>
                                    <option value="NET_BANKING">Net Banking</option>
                                    <option value="CASH">Cash</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer border-top-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-ngo-primary">Submit Donation</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</body>
</html>
