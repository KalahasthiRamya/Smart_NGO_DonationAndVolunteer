<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Notifications')"></head>
<body>
    <div id="sidebar" th:replace="fragments/sidebar :: sidebar('messages')"></div>

    <div id="main-content">
        <header th:replace="fragments/header :: header('Messages & Alerts')"></header>

        <div class="container-fluid p-4">
            <div class="card custom-table-card p-4">
                <h6 class="fw-bold mb-3 text-dark"><i class="bi bi-bell me-2 text-success"></i>System Notifications Log</h6>
                <div class="list-group list-group-flush">
                    <div class="list-group-item py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-success bg-opacity-10 text-success fw-bold mb-1">DONATION</span>
                            <span class="small text-muted">Just now</span>
                        </div>
                        <div class="fw-semibold text-dark">Donation of ₹15,000 received from Rahul Patil for 'Education for All'.</div>
                    </div>
                    <div class="list-group-item py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-primary bg-opacity-10 text-primary fw-bold mb-1">TASK</span>
                            <span class="small text-muted">2 hours ago</span>
                        </div>
                        <div class="fw-semibold text-dark">Sneha Desai marked 'Food Donation Drive' as COMPLETED.</div>
                    </div>
                    <div class="list-group-item py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-info bg-opacity-10 text-info fw-bold mb-1">REGISTRATION</span>
                            <span class="small text-muted">1 day ago</span>
                        </div>
                        <div class="fw-semibold text-dark">New volunteer registration: Rohan Kulkarni (Logistics).</div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</body>
</html>
