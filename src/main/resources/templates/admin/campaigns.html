<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Campaign Management')"></head>
<body>
    <div id="sidebar" th:replace="fragments/sidebar :: sidebar('campaigns')"></div>

    <div id="main-content">
        <header th:replace="fragments/header :: header('Campaign Management')"></header>

        <div class="container-fluid p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold text-dark mb-1">Active NGO Campaigns</h5>
                    <p class="text-muted small mb-0">Manage initiative targets, progress, and execution timelines</p>
                </div>
                <button type="button" class="btn btn-ngo-primary" data-bs-toggle="modal" data-bs-target="#createCampaignModal">
                    <i class="bi bi-plus-lg me-1"></i> Create New Campaign
                </button>
            </div>

            <!-- Campaign Cards Grid -->
            <div class="row g-4 mb-4">
                <div th:each="camp : ${campaigns}" class="col-md-6 col-xl-4">
                    <div class="card h-100 border-0 shadow-sm rounded-3">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="badge bg-light text-dark border" th:text="${camp.category}">EDUCATION</span>
                                <span class="badge badge-status badge-active" th:text="${camp.status}">ACTIVE</span>
                            </div>
                            <h5 class="fw-bold text-dark mb-2" th:text="${camp.name}">Education for All</h5>
                            <p class="text-muted small mb-3" th:text="${camp.description}">Provide free school supplies to children.</p>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="small fw-semibold text-secondary">Funded Progress</span>
                                    <span class="small fw-bold text-success" th:text="${camp.progressPercentage} + '%'">67%</span>
                                </div>
                                <div class="progress" style="height: 10px;">
                                    <div class="progress-bar bg-success" role="progressbar" th:style="'width: ' + ${camp.progressPercentage} + '%;'"></div>
                                </div>
                                <div class="d-flex justify-content-between mt-2 small text-muted">
                                    <span>Collected: <strong>₹<span th:text="${#numbers.formatDecimal(camp.collectedAmount, 1, 'COMMA', 2, 'POINT')}">40,000</span></strong></span>
                                    <span>Target: <strong>₹<span th:text="${#numbers.formatDecimal(camp.targetAmount, 1, 'COMMA', 2, 'POINT')}">60,000</span></strong></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Campaign Modal -->
        <div class="modal fade" id="createCampaignModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold text-dark">Create New Campaign</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/campaigns/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Campaign Name</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Healthcare for Rural Villages" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Description</label>
                                <textarea name="description" class="form-control" rows="3" placeholder="Brief outline of campaign objectives"></textarea>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Category</label>
                                    <select name="category" class="form-select" required>
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Target Amount (₹)</label>
                                    <input type="number" step="0.01" name="targetAmount" class="form-control" placeholder="50000" required>
                                </div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Start Date</label>
                                    <input type="date" name="startDate" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">End Date</label>
                                    <input type="date" name="endDate" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer border-top-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-ngo-primary">Create Campaign</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</body>
</html>
