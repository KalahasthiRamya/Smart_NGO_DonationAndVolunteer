<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header class="top-header" th:fragment="header(pageTitle)">
    <div class="d-flex align-items-center gap-3">
        <h4 class="header-title" th:text="${pageTitle}">Dashboard</h4>
    </div>
    <div class="d-flex align-items-center gap-4">
        <!-- Notification Dropdown -->
        <div class="dropdown">
            <a href="javascript:void(0)" class="text-secondary position-relative fs-5 fs-md-4 dropdown-toggle no-arrow" id="notificationMenu" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-bell"></i>
                <span th:if="${unreadNotificationCount > 0}" 
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                      style="font-size: 0.65rem;"
                      th:text="${unreadNotificationCount}">3</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2 p-0" aria-labelledby="notificationMenu" style="width: 320px; max-height: 400px; overflow-y: auto;">
                <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
                    <h6 class="fw-bold mb-0 text-dark">Notifications</h6>
                    <form th:action="@{/notifications/mark-all-read}" method="post" class="m-0" th:if="${unreadNotificationCount > 0}">
                        <button type="submit" class="btn btn-link btn-sm text-decoration-none p-0 style-xs text-primary">Mark all as read</button>
                    </form>
                </div>
                <div class="list-group list-group-flush">
                    <div th:each="n : ${recentNotifications}" 
                         class="list-group-item list-group-item-action p-3" 
                         th:classappend="${n.status == 'UNREAD'} ? 'bg-light fw-semibold' : ''">
                        <div class="d-flex w-100 justify-content-between align-items-start mb-1">
                            <span class="badge bg-primary text-uppercase" style="font-size: 0.6rem;" th:text="${n.type}">SYSTEM</span>
                            <small class="text-muted" style="font-size: 0.7rem;" th:text="${#temporals.format(n.createdAt, 'dd MMM, HH:mm')}">Just now</small>
                        </div>
                        <p class="mb-1 text-dark small" th:text="${n.message}">Notification message text goes here.</p>
                        <div th:if="${n.status == 'UNREAD'}" class="text-end mt-1">
                            <form th:action="@{'/notifications/mark-read/' + ${n.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-secondary btn-sm py-0 px-2" style="font-size: 0.7rem;">Mark as read</button>
                            </form>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(recentNotifications)}" class="p-3 text-center text-muted small">
                        No notifications found.
                    </div>
                </div>
                <div class="p-2 border-top text-center bg-light">
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/notifications}" class="small text-decoration-none fw-semibold text-primary">View All Notifications</a>
                    <a sec:authorize="hasRole('DONOR')" th:href="@{/donor/notifications}" class="small text-decoration-none fw-semibold text-primary">View All Notifications</a>
                    <a sec:authorize="hasRole('VOLUNTEER')" th:href="@{/volunteer/notifications}" class="small text-decoration-none fw-semibold text-primary">View All Notifications</a>
                </div>
            </div>
        </div>

        <!-- User Role Profile Dropdown -->
        <div class="dropdown">
            <div class="user-profile-badge dropdown-toggle" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="user-avatar" th:text="${#authentication != null and #authentication.name != null and #strings.length(#authentication.name) > 0 ? #strings.substring(#authentication.name, 0, 1).toUpperCase() : 'U'}">
                    A
                </div>
                <div class="d-none d-md-block text-end">
                    <span class="fw-semibold d-block text-dark small" sec:authentication="name">User</span>
                    <span class="badge bg-secondary text-uppercase px-2" style="font-size: 0.65rem;" sec:authentication="principal.authorities[0].authority">ROLE</span>
                </div>
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" aria-labelledby="userMenu">
                <li><a class="dropdown-item py-2" sec:authorize="hasRole('DONOR')" th:href="@{/donor/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                <li><a class="dropdown-item py-2" sec:authorize="hasRole('VOLUNTEER')" th:href="@{/volunteer/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                <li><a class="dropdown-item py-2" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/settings}"><i class="bi bi-gear me-2"></i>Settings</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item text-danger py-2" href="javascript:void(0)" onclick="document.getElementById('logoutForm').submit()">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
</html>
