<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 Access Denied - Smart NGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm max-w-500">
        <i class="bi bi-shield-lock-fill display-1 text-warning mb-3"></i>
        <h2 class="fw-bold text-dark mb-2">403 - Access Denied</h2>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'You do not have permission to access this resource.'}">You do not have permission to access this page.</p>
        <a th:href="@{/login}" class="btn btn-ngo-primary px-4 py-2">Return to Login</a>
    </div>
</body>
</html>
