<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 Page Not Found - Smart NGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm max-w-500">
        <i class="bi bi-exclamation-triangle-fill display-1 text-danger mb-3"></i>
        <h2 class="fw-bold text-dark mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page or resource could not be found.'}">The page you are looking for does not exist.</p>
        <a th:href="@{/login}" class="btn btn-ngo-primary px-4 py-2">Return Home</a>
    </div>
</body>
</html>
