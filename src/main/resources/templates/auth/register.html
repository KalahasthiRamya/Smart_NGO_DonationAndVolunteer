<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart NGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="row g-0">
            <!-- Left Branding -->
            <div class="col-md-5 auth-sidebar">
                <i class="bi bi-person-plus-fill display-1 mb-3"></i>
                <h2 class="fw-bold mb-2">Join Smart NGO</h2>
                <p class="text-white-50 fs-6 px-3">Empowering communities through seamless donation and volunteer coordination.</p>
            </div>

            <!-- Right Registration Form -->
            <div class="col-md-7 auth-form-container">
                <div class="mb-4">
                    <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
                    <p class="text-muted small">Register to get started</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                <form th:action="@{/register}" th:object="${userDto}" method="post">
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="Enter phone number">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Select Role</label>
                            <select th:field="*{role}" class="form-select" id="roleSelect">
                                <option value="DONOR">DONOR</option>
                                <option value="VOLUNTEER">VOLUNTEER</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Create a password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <div class="mb-4" id="skillsContainer" style="display: none;">
                        <label class="form-label small fw-semibold text-secondary">Volunteer Skills</label>
                        <input type="text" th:field="*{skills}" class="form-control" placeholder="e.g. Teaching, Logistics, Content Writing">
                    </div>

                    <button type="submit" class="btn btn-ngo-primary w-100 py-2.5">Register</button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Already have an account? <a th:href="@{/login}" class="text-success fw-semibold text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('roleSelect').addEventListener('change', function() {
            const skillsDiv = document.getElementById('skillsContainer');
            if (this.value === 'VOLUNTEER') {
                skillsDiv.style.display = 'block';
            } else {
                skillsDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
